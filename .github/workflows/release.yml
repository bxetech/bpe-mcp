# Auto-publish to npm on push to main (latest) or next (next dist-tag).
#
# Workflow:
#   - Push to `next` → publish with `--tag next` (QA / pre-release; opt-in
#     for testers via `npm install @bxetech/bpe-mcp@next`).
#   - Push to `main` → publish with `--tag latest` (production; default
#     for everyone running `npm install @bxetech/bpe-mcp`).
#
# Requires the NPM_TOKEN repo secret. Token must have publish scope for the
# @bxetech npm scope. Generate at https://www.npmjs.com/settings/<user>/tokens
# (granular token recommended, scoped to "@bxetech/*").
#
# The job uses the version in package.json as-is. Bump the version in the
# PR that gets merged. Pre-release versions (0.2.0-beta.1) only make sense
# on the `next` branch.

name: Release

on:
  push:
    branches:
      - main
      - next

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # for npm provenance (recommended for OSS packages)

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          scope: "@bxetech"

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Determine dist-tag
        id: tag
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "dist_tag=latest" >> "$GITHUB_OUTPUT"
          else
            echo "dist_tag=next" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify version is publishable
        id: version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "package_version=$PKG_VERSION" >> "$GITHUB_OUTPUT"
          # If this exact version is already on npm, skip publish (idempotent).
          if npm view "@bxetech/bpe-mcp@$PKG_VERSION" version > /dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "Version $PKG_VERSION already on npm — skipping publish."
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.version.outputs.already_published == 'false'
        run: |
          npm publish --tag "${{ steps.tag.outputs.dist_tag }}" --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Summary
        run: |
          echo "### Publish summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Package: \`@bxetech/bpe-mcp\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: ${{ steps.version.outputs.package_version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- dist-tag: ${{ steps.tag.outputs.dist_tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Already published: ${{ steps.version.outputs.already_published }}" >> "$GITHUB_STEP_SUMMARY"
